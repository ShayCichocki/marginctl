version: "2"

linters:
  default: standard
  # standard = errcheck, govet, ineffassign, staticcheck, unused.
  exclusions:
    generated: lax
    rules:
      # Test files legitimately ignore many return values (fmt.Fprintf to an
      # httptest recorder, w.Write, etc.).
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
